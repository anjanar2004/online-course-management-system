<!DOCTYPE html>
<html>
<head>
    <title>Course Management Dashboard</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <span class="navbar-brand mb-0 h1">
            Course Management System
        </span>

        <a href="{% url 'logout' %}" class="btn btn-light">
            Logout
        </a>
    </div>
</nav>

<div class="container mt-5">

    <div class="text-center mb-4">
        <h1>Welcome, {{ request.user.username }} 👋</h1>
        <p class="text-muted">Your Dashboard</p>
    </div>

    <div class="row g-4">

        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Role</h5>
                    <h3>{{ role }}</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">Total Courses</h5>
                    <h3>{{ total_courses }}</h3>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card shadow-sm text-center">
                <div class="card-body">
                    <h5 class="card-title">My Enrollments</h5>
                    <h3>{{ my_enrollments }}</h3>
                </div>
            </div>
        </div>

    </div>

    <div class="text-center mt-5">

        <a href="{% url 'course_list' %}" class="btn btn-primary me-2">
            View Courses
        </a>

        <a href="{% url 'my_enrollments' %}" class="btn btn-success me-2">
            My Enrollments
        </a>

        <a href="{% url 'reports' %}" class="btn btn-info">
            Reports
        </a>

    </div>

</div>

</body>
</html>
