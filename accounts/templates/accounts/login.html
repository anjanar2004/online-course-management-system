<!DOCTYPE html>
<html>
<head>
    <title>Login - Course Management System</title>

    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2f7, #dfe6ee);
        }

        .login-card {
            width: 100%;
            max-width: 410px;
            padding: 42px;
            background: #ffffff;
            border-radius: 22px;

            box-shadow:
                0 25px 45px rgba(0, 0, 0, 0.15),
                0 8px 15px rgba(0, 0, 0, 0.08);

            transform: perspective(1000px) translateZ(0);
            transition: 0.3s ease;
        }

        .login-card:hover {
            transform: perspective(1000px) translateY(-5px);
            box-shadow:
                0 30px 55px rgba(0, 0, 0, 0.18),
                0 10px 18px rgba(0, 0, 0, 0.08);
        }

        .logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 18px;
            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 38px;
            background: #f1f5f9;
            border-radius: 20px;

            box-shadow:
                6px 6px 12px rgba(0, 0, 0, 0.12),
                -5px -5px 12px rgba(255, 255, 255, 0.9);
        }

        h1 {
            text-align: center;
            margin: 0;
            color: #222;
            font-size: 26px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin: 10px 0 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            color: #333;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;

            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;

            box-shadow: inset 2px 2px 5px rgba(0, 0, 0, 0.05);
        }

        input:focus {
            outline: none;
            border-color: #0d6efd;
        }

        .login-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 10px;

            background: #0d6efd;
            color: white;

            font-size: 16px;
            font-weight: 600;

            cursor: pointer;

            box-shadow:
                0 6px 0 #084298,
                0 10px 18px rgba(13, 110, 253, 0.25);

            transition: 0.15s;
        }

        .login-btn:hover {
            transform: translateY(-2px);
        }

        .login-btn:active {
            transform: translateY(5px);
            box-shadow: 0 1px 0 #084298;
        }

        .error {
            background: #ffe5e5;
            color: #d00000;
            padding: 10px;
            border-radius: 9px;
            margin-bottom: 20px;
            text-align: center;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #666;
        }

        .signup a {
            color: #0d6efd;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">📚</div>

    <h1>Course Management System</h1>

    <p class="subtitle">
        Welcome back! Please login to continue.
    </p>

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="post">

        {% csrf_token %}

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter your username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit" class="login-btn">
            Login
        </button>

    </form>

    <div class="signup">
        Don't have an account?
        <a href="{% url 'signup' %}">Create Account</a>
    </div>

</div>

</body>
</html>
